# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the Express API (Docker) and the React client (static site).
# Create via Render Dashboard -> New -> Blueprint, pointed at this repo.

services:
  # ---------------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------------
  - type: web
    name: bookflow-server
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render injects PORT automatically; app.js reads process.env.PORT.
      - key: CLIENT_HOST
        fromService:
          type: web
          name: bookflow-client
          property: host
      - key: JWT_SECRET
        generateValue: true     # Render generates + stores a strong secret
      # Set these in the Render dashboard (marked secret / sync:false):
      - key: MONGO_URI
        sync: false             # MongoDB Atlas SRV connection string
      - key: STRIPE_SECRET_KEY
        sync: false             # sk_live_... or sk_test_...
      - key: STRIPE_WEBHOOK_SECRET
        sync: false             # whsec_... from the Stripe webhook endpoint

  # ---------------------------------------------------------------------------
  # Client (static)
  # ---------------------------------------------------------------------------
  - type: web
    name: bookflow-client
    runtime: static
    # VITE_API_BASE is baked into the bundle at build time from the API service's
    # host, so renaming/moving the server can't break the link. The client calls
    # that origin directly; the server allows it via CORS (CLIENT_HOST).
    buildCommand: cd client && npm install && VITE_API_BASE="https://$API_HOST" npm run build
    staticPublishPath: ./client/dist
    autoDeploy: true
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: bookflow-server
          property: host
    routes:
      # SPA fallback for react-router.
      - type: rewrite
        source: /*
        destination: /index.html
